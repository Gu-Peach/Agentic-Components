services:
  # PostgreSQL - structured data (users / projects / catalog)
  postgres:
    image: postgres:16-alpine
    container_name: behavior-postgres
    environment:
      POSTGRES_DB: behavior
      POSTGRES_USER: behavior_user
      POSTGRES_PASSWORD: behavior_pass
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database/init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U behavior_user -d behavior"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - behavior-network

  # MongoDB - scene documents and flexible configs
  mongodb:
    image: mongo:7.0
    container_name: behavior-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: behavior_user
      MONGO_INITDB_ROOT_PASSWORD: behavior_pass
      MONGO_INITDB_DATABASE: behavior
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongodb:/data/db
      - ./database/init/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - behavior-network

  # Redis - cache and runtime state
  redis:
    image: redis:7-alpine
    container_name: behavior-redis
    command: redis-server --appendonly yes --requirepass behavior_pass
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "behavior_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - behavior-network

  # MinIO - object storage for 3D models and assets
  minio:
    image: minio/minio:latest
    container_name: behavior-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: behavior_user
      MINIO_ROOT_PASSWORD: behavior_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - behavior-network

  # pgAdmin - PostgreSQL web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: behavior-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@behavior.dev
      PGADMIN_DEFAULT_PASSWORD: behavior_pass
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      - ./database/admin/pgadmin/servers.json:/pgadmin4/servers.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - behavior-network

  # Mongo Express - MongoDB web UI
  mongo-express:
    image: mongo-express:latest
    container_name: behavior-mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://behavior_user:behavior_pass@host.docker.internal:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: behavior_pass
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - behavior-network

  # Redis Commander - Redis web UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: behavior-redis-commander
    environment:
      REDIS_HOSTS: behavior-redis:host.docker.internal:6379:0:behavior_pass
      HTTP_USER: admin
      HTTP_PASSWORD: behavior_pass
    ports:
      - "8082:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - behavior-network

networks:
  behavior-network:
    driver: bridge
